# Deployment environment for Cloud Run.
#
# TWO THINGS THIS FILE DOES NOT CARRY, AND MUST NOT.
#
# 1. Secrets. PHONE_HASH_SECRET and PHONE_ENCRYPTION_SECRET protect phone
#    numbers, which are the only authentication factor the product has. They
#    come from Secret Manager, set with --set-secrets, never written here. The
#    server now refuses to start in production without them, so a deploy that
#    forgets them fails loudly instead of booting on the placeholder that used
#    to be published in this repository.
#
# 2. SYNZAPP_STAFF_DOMAIN. It is deliberately absent, and that is a trap:
#    deploying with --env-vars-file would REPLACE the live service environment
#    and drop it, locking every Synzapp staff account out of the staff console.
#    For a code-only deploy, never pass --env-vars-file or --set-env-vars.
NODE_ENV: "production"
# Named origins, never *. A wildcard lets any site on the internet make
# credentialed calls to this API from somebody's browser.
CORS_ORIGIN: "https://synzapp.com,https://admin.synzapp.com,https://synzapp-a7ee3.web.app,https://synzapp-admin.web.app"
FIREBASE_PROJECT_ID: "synzapp-a7ee3"
FIREBASE_STORAGE_BUCKET: "synzapp-a7ee3.firebasestorage.app"
# Still off, and it is not safe. App Check fails open when it is off, so
# every route that asks for it is unprotected. It cannot be turned on
# until the mobile app attaches an App Check token - today only the web
# app does, so enforcing this would reject every request from the phone.
SYNZAPP_REQUIRE_APP_CHECK: "false"
AUTH_RATE_LIMIT_WINDOW_MS: "60000"
AUTH_RATE_LIMIT_MAX: "20"
OTP_RATE_LIMIT_WINDOW_MS: "900000"
OTP_RATE_LIMIT_MAX: "5"
OPENAI_MODEL: "gpt-5.6-terra"
OPENAI_REQUEST_TIMEOUT_MS: "25000"
OPENAI_INTERPRETER_AGENT_REALTIME_MODEL: "gpt-realtime-2.1"
OPENAI_INTERPRETER_REALTIME_MODEL: "gpt-realtime-translate"
OPENAI_INTERPRETER_TRANSCRIPTION_MODEL: "gpt-live-transcribe"
OPENAI_INTERPRETER_SEGMENT_MODEL: "gpt-5.6-terra"
OPENAI_INTERPRETER_SEGMENT_TTS_MODEL: "gpt-4o-mini-tts"
OPENAI_INTERPRETER_SEGMENT_TTS_VOICE: "cedar"
OPENAI_INTERPRETER_SUMMARY_MODEL: "gpt-5.6-terra"
OPENAI_INTERPRETER_SUMMARY_TTS_MODEL: "gpt-4o-mini-tts"
OPENAI_INTERPRETER_SUMMARY_TTS_VOICE: "cedar"
INTERPRETER_MAX_TARGET_LANGUAGES: "4"
INTERPRETER_RETENTION_DAYS: "90"
INTERPRETER_AUDIO_RETENTION: "false"
INTERPRETER_SEGMENT_AUDIO_ENABLED: "true"
INTERPRETER_SUMMARY_ENABLED: "true"
INTERPRETER_SUMMARY_AUDIO_ENABLED: "true"
INTERPRETER_REMINDER_WORKER_ENABLED: "true"
INTERPRETER_REMINDER_WORKER_INTERVAL_MS: "60000"
INTERPRETER_REMINDER_WORKER_BATCH_SIZE: "50"
INTERPRETER_REMINDER_WORKER_TENANT_BATCH_SIZE: "100"
INTERPRETER_APPROVED_CURRENT_FACTS: ""
INTERPRETER_CURRENT_US_PRESIDENT: ""
APNS_BUNDLE_ID: "com.synzapp.mobile"
APNS_ENVIRONMENT: "sandbox"
